name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（含 dev 依赖，契约校验需要 jsonschema）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff 静态检查
        run: ruff check .

      - name: 契约测试（schema 与 pydantic 对齐）
        run: pytest tests/contract -q

      - name: 全部单测
        run: pytest -q

      - name: D0 验收（无摄像头、无模型，纯 Mock 跑通全链路）
        run: python -m pipeline.runner --source synthetic:30 --mock-all

      - name: D0 断言（必须真的产出 DetectionEvent）
        run: |
          python -m pipeline.runner --source synthetic:30 --mock-all --quiet | tee /tmp/d0.txt
          grep -q "PIPELINE OK" /tmp/d0.txt
          grep -q "t-0001" /tmp/d0.txt
          grep -q "FEED_DISPENSE" /tmp/d0.txt

  test-models:
    # 上面那个 test job 只装 .[dev]，onnxruntime 在 [pi] 里，所以需要模型的单测会安静地
    # skip 掉——tests/fixtures 里的图片曾被 CRLF 规范化改坏、挂了很久没人发现，就是因为它
    # 只在装了 onnxruntime 的机器上才会失败。这个 job 把推理依赖装上，逼这些测试真跑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装（含 onnxruntime）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" onnxruntime

      - name: 模型单测（不允许因缺依赖而 skip）
        run: |
          pytest tests/test_cat_classifier.py -q -rs | tee /tmp/models.txt
          if grep -qi "skipped" /tmp/models.txt; then
            echo "::error::模型测试被跳过 —— 检查 onnxruntime 是否装上、models/cat_vs_notcat.onnx 是否还在"
            exit 1
          fi

  package-check:
    # tests/conftest.py 会手动把仓库根和 contracts/python 塞进 sys.path，所以即使
    # [tool.setuptools] 的映射写错，pytest 也照样全绿。这个 job 用非 -e 安装，再从仓库外的
    # 目录 import，才能真正验证打出来的包里有什么。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 以 wheel 方式安装（注意不是 -e）
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: 从仓库外 import（conftest 兜不住这里）
        working-directory: ${{ runner.temp }}
        run: python -c "import catvision_contracts, modules, pipeline, mocks; print('packaging ok')"

  contract-guard:
    # 改了契约文件但没改 CHANGELOG 就拦下来
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查契约改动是否同步更新 CHANGELOG
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE "^contracts/v1/"; then
            if ! echo "$changed" | grep -q "^contracts/CHANGELOG.md"; then
              echo "::error::改了 contracts/v1/ 下的 schema，但没有更新 contracts/CHANGELOG.md"
              exit 1
            fi
          fi
